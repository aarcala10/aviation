name: Aviation
options:
  bundleIdPrefix: com.aarcala10
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Aviation:
    type: application
    platform: iOS
    sources: [Aviation]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Aviation
        UILaunchScreen: {}
        AviationstackAccessKey: $(AVIATIONSTACK_ACCESS_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            api.aviationstack.com:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarcala10.Aviation
  AviationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AviationTests]
    dependencies:
      - target: Aviation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarcala10.AviationTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aviation:
    build:
      targets:
        Aviation: all
    test:
      targets: [AviationTests]
